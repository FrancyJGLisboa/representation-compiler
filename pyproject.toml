[project]
name = "representation-compiler"
version = "0.1.0"
description = "Evidence-backed representation search for messy operational information"
requires-python = ">=3.11"

[project.optional-dependencies]
openai = ["openai>=1"]
astronomy = ["astropy>=6"]

[project.scripts]
representation-compiler = "representation_compiler.cli:main"
repr = "representation_compiler.command:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["representation_compiler*"]
